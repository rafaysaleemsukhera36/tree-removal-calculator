<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tree Removal Estimate</title>
<meta name="description" content="Free, open-source tree removal cost calculator for the USA. Enter the tree height and get an instant price estimate in USD.">
<style>
  body { font-family: system-ui, sans-serif; background: #f3f6f2; color: #1d2b1f; margin: 0; padding: 16px; }
  .card { max-width: 400px; margin: 40px auto; background: #fff; padding: 24px; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
  h1 { font-size: 1.4rem; margin: 0 0 16px; }
  label { display: block; font-weight: 600; margin-bottom: 6px; }
  input { width: 100%; box-sizing: border-box; padding: 10px; font-size: 1rem; border: 1px solid #b9c7ba; border-radius: 8px; }
  button { width: 100%; margin-top: 12px; padding: 12px; font-size: 1rem; font-weight: 600; color: #fff; background: #2e7d32; border: 0; border-radius: 8px; cursor: pointer; }
  button:hover { background: #256628; }
  #result { margin-top: 18px; font-size: 1.1rem; }
  .price { font-size: 1.6rem; font-weight: 700; color: #2e7d32; }
  .note { font-size: .8rem; color: #667; margin-top: 16px; }
</style>
</head>
<body>
<div class="card">
  <h1>🌳 Tree Removal Estimate (USA)</h1>
  <form id="f">
    <label for="h">Tree height (feet)</label>
    <input id="h" type="number" min="1" step="1" placeholder="e.g. 40" required>
    <button type="submit">Calculate</button>
  </form>
  <div id="result"></div>
  <p class="note">Rough US national averages. Actual price depends on location, trunk diameter, tree condition, nearby structures and stump grinding.</p>
</div>
<script>
  // [max height in ft, low price, high price, size label]
  const tiers = [
    [30,  200,  500,  "Small tree"],
    [60,  500,  1000, "Medium tree"],
    [80,  800,  1500, "Large tree"],
    [Infinity, 1500, 2500, "Very large tree"]
  ];
  const usd = n => n.toLocaleString("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 });

  document.getElementById("f").addEventListener("submit", e => {
    e.preventDefault();
    const h = parseFloat(document.getElementById("h").value);
    const out = document.getElementById("result");
    if (!(h > 0)) { out.textContent = "Please enter a valid height."; return; }
    const [, low, high, label] = tiers.find(t => h <= t[0]);
    out.innerHTML = `${label} (${h} ft)<br><span class="price">${usd(low)} – ${usd(high)}</span>`;
  });
</script>
</body>
</html>
